name: Collect public opportunities
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
concurrency:
  group: internshipos-collection
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ vars.COLLECTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCHEDULER_ENABLED: 'false'
      COLLECTION_BATCH_SIZE: '96'
      COLLECTION_CONCURRENCY: '6'
      COLLECTION_MAX_DETAILS: '40'
      COLLECTION_MAX_PAGES: '10'
      COLLECTION_SOURCE_TIMEOUT: '90'
      COLLECTION_TARGET_ONLY: 'true'
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: 'https://internshipos.vercel.app/api/integrations/google/callback'
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-jobspy.txt
      - run: python -m internshipos.bootstrap
        env:
          PYTHONPATH: backend
      - run: python -m internshipos.jobs tick
        env:
          PYTHONPATH: backend
