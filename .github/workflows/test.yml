name: Test application
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: internshipos
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
          SCHEDULER_ENABLED: 'false'
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only@localhost:5432/internshipos
      - run: python -m internshipos.bootstrap
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/internshipos
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: npm ci && npm test
        working-directory: extension
