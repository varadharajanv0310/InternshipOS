services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: internshipos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password in .env}
      POSTGRES_DB: internshipos
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internshipos"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://internshipos:${POSTGRES_PASSWORD}@db:5432/internshipos
      SCHEDULER_ENABLED: "true"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
